# ================================================================
# Production profile — container deployment
# DB config read from environment variables (set in docker-compose)
# ================================================================
logging.level.com.resumainer=INFO
logging.level.org.springframework=WARN

# Database — PostgreSQL (prod profile, configured via env vars)
# In Docker, DB_HOST=db (service name), DB_PORT=5432, etc.
db.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME:resumainer}
db.user=${DB_USER}
db.password=${DB_PASSWORD}
db.driver=org.postgresql.Driver

# Connection pool settings
db.pool.initial-size=2
db.pool.max-size=10
db.pool.timeout-ms=30000

# Flyway (auto-migration on startup)
flyway.enabled=true
flyway.locations=classpath:db/migration

# Email config (production — read from Docker env vars)
app.email.resend.api-key=${RESEND_API_KEY}
app.email.from=${APP_EMAIL_FROM:ResumAIner <noreply@send.resumainer.com>}
app.email.dev-fallback-enabled=false
app.frontend.public.base-url=${APP_FRONTEND_PUBLIC_BASE_URL}
app.backend.public.base-url=${APP_BACKEND_PUBLIC_BASE_URL}

# Trust X-Real-IP only from the configured immediate reverse proxy peer.
app.auth.trusted-proxy-hosts=${APP_AUTH_TRUSTED_PROXY_HOSTS:}
