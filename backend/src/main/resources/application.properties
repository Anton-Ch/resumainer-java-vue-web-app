# ================================================================
# ResumAIner Backend — Application Configuration
# ================================================================
spring.application.name=ResumAIner

# Active profile — set via SPRING_PROFILES_ACTIVE env var or -Dspring.profiles.active
# No default: safe — dev profile must be explicitly activated.

# Server port (override via SERVER_PORT env var)
server.port=${SERVER_PORT:8080}

# Encoding
spring.web.encoding.charset=UTF-8
spring.web.encoding.enabled=true

# Landing Page CTA target (externalized per SEC-001)
landing.cta.url=/app/auth

# Error handling — never expose stack traces to the client
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# ================================================================
# Database — PostgreSQL (dev profile)
# ================================================================
# Custom Connection Pool reads these values via @Value
db.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resumainer}
db.user=${DB_USER:resumainer}
db.password=${DB_PASSWORD:resumainer_dev}
db.driver=org.postgresql.Driver

# Connection pool settings
db.pool.initial-size=2
db.pool.max-size=10
db.pool.timeout-ms=30000

# Flyway (auto-migration on startup)
flyway.enabled=true
flyway.locations=classpath:db/migration

# ================================================================
# Captcha — Cloudflare Turnstile
# ================================================================
# Captcha provider: turnstile
app.captcha.enabled=${APP_CAPTCHA_ENABLED:true}
app.captcha.provider=${APP_CAPTCHA_PROVIDER:turnstile}
app.captcha.turnstile.secret-key=${TURNSTILE_SECRET_KEY:}
app.captcha.dev-token=${APP_CAPTCHA_DEV_TOKEN:dev-captcha-pass}
app.captcha.dev-bypass-enabled=${APP_CAPTCHA_DEV_BYPASS_ENABLED:false}
app.captcha.turnstile.verify-url=${APP_TURNSTILE_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
app.captcha.turnstile.timeout-ms=${APP_TURNSTILE_TIMEOUT_MS:10000}

# ================================================================
# Email — Resend
# ================================================================
# Email provider: resend
app.email.provider=${APP_EMAIL_PROVIDER:resend}
app.email.resend.api-key=${RESEND_API_KEY:}
app.email.resend.api-url=${APP_EMAIL_RESEND_API_URL:https://api.resend.com/emails}
app.email.resend.timeout-ms=${APP_EMAIL_RESEND_TIMEOUT_MS:10000}
app.email.from=${APP_EMAIL_FROM:ResumAIner <noreply@send.resumainer.com>}
app.email.dev-fallback-enabled=${APP_EMAIL_DEV_FALLBACK_ENABLED:false}

# ================================================================
# Public URLs — used by email templates for action links
# ================================================================
app.frontend.public.base-url=${APP_FRONTEND_PUBLIC_BASE_URL:http://localhost:5173}
app.backend.public.base-url=${APP_BACKEND_PUBLIC_BASE_URL:http://localhost:8080}
